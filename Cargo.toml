[package]
name = "shareos-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "ShareOS Desktop für Windows, Linux und macOS"

[dependencies]
anyhow = "1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
vt100 = "0.15"
if-addrs = "0.13"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
